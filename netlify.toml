
[build]
command = "npm run build"
publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PRISMA_GENERATE_DATAPROXY = "true"
  PRISMA_GENERATE_SKIP_DOWNLOAD = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
